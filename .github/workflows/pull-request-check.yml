name: Pull Request Check

on: pull_request

jobs:

  AndroidTest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls /dev/kvm
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The default also installs the legacy "tools" package, which the SDK
        # repository no longer serves; sdkmanager then fails the job.
        packages: 'platform-tools'
    - name: Run unit tests
      run: ./gradlew app:testDebugUnitTest -PskipScreenshots
    - name: Run lint
      run: ./gradlew app:lintDebug
    - name: Run connected android tests
      run: ./gradlew app:mvdApi35Check
