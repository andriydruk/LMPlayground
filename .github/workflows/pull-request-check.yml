name: Pull Request Check

on:
  pull_request:
    # The website alone doesn't need the Android and iOS builds.
    paths-ignore:
      - 'docs/**'

jobs:

  AndroidTest:
    defaults:
      run:
        working-directory: android
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls /dev/kvm
    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        # The default also installs the legacy "tools" package, which the SDK
        # repository no longer serves; sdkmanager then fails the job.
        packages: 'platform-tools'
    # The Vulkan backend (GGML_VULKAN=ON) needs three host build-time deps that
    # build.gradle probes for at configure time but the runner lacks by default:
    #   - glslc: bundled in the pinned NDK, but AGP only auto-downloads the NDK
    #     during task execution (after the path is probed), so pre-install it.
    #   - Vulkan C++ headers (vulkan.hpp) and SPIRV-Headers (CONFIG package +
    #     include dir), needed by ggml-vulkan's find_package / includes.
    # We install them and export the override env vars build.gradle reads, so
    # the exact paths reach CMake regardless of where apt places them.
    - name: Set up Vulkan toolchain for the native build
      run: |
        set -eu
        SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
        printf 'y\n' | "$SDKMANAGER" --install "ndk;27.2.12479018" >/dev/null
        GLSLC="$ANDROID_HOME/ndk/27.2.12479018/shader-tools/linux-x86_64/glslc"
        test -x "$GLSLC"
        echo "VULKAN_GLSLC=$GLSLC" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev spirv-headers
        # apt installs these under /usr/include, which CMake omits from -I for
        # the NDK cross-compiler (it treats /usr/include as a standard dir the
        # host compiler already searches; the cross clang does not). Stage them
        # under a non-standard prefix so the -I is actually emitted.
        VKINC="$RUNNER_TEMP/vk-headers/include"
        mkdir -p "$VKINC"
        for d in vulkan vk_video spirv; do
          [ -d "/usr/include/$d" ] && cp -r "/usr/include/$d" "$VKINC/"
        done
        test -f "$VKINC/vulkan/vulkan.hpp"
        test -f "$VKINC/spirv/unified1/spirv.hpp"
        SPIRV_CFG="$(find /usr -name SPIRV-HeadersConfig.cmake 2>/dev/null | head -1)"
        test -n "$SPIRV_CFG"
        echo "VULKAN_HEADERS_DIR=$VKINC" >> "$GITHUB_ENV"
        echo "SPIRV_HEADERS_INCLUDE_DIR=$VKINC" >> "$GITHUB_ENV"
        echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")" >> "$GITHUB_ENV"
    - name: Run unit tests
      run: ./gradlew app:testDebugUnitTest -PskipScreenshots
    - name: Run lint
      run: ./gradlew app:lintDebug
    - name: Run connected android tests
      run: ./gradlew app:mvdApi35Check

  iOSTest:
    defaults:
      run:
        working-directory: ios
    runs-on: macos-26

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Show Xcode
      run: xcodebuild -version
    # The engine takes long to build; it only changes with llama.cpp or its
    # build scripts, which is what check-xcframework.sh compares.
    - name: Find llama.cpp revision
      id: llama
      run: echo "sha=$(git -C ../core/llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Cache llama.xcframework
      id: xcframework
      uses: actions/cache@v6
      with:
        path: |
          ios/build-apple/llama.xcframework
          ios/build-apple/llama.xcframework.stamp
        key: xcframework-${{ steps.llama.outputs.sha }}-${{ hashFiles('ios/scripts/build-xcframework.sh', 'ios/native/CMakeLists.txt', 'core/CMakeLists.txt') }}
    - name: Build llama.xcframework
      if: steps.xcframework.outputs.cache-hit != 'true'
      run: scripts/build-xcframework.sh
    - name: Pick a simulator
      run: |
        udid=$(xcrun simctl list devices available -j | python3 -c '
        import json, sys
        devices = json.load(sys.stdin)["devices"]
        phones = [d for runtime, ds in sorted(devices.items(), reverse=True) if ".iOS-" in runtime
                  for d in ds if d["name"].startswith("iPhone")]
        print(next((d for d in phones if "Pro" in d["name"]), phones[0])["udid"])')
        echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
    # The macOS LlamaKit tests need downloaded models, so CI leaves them out.
    - name: Run unit tests
      run: |
        xcodebuild test -project LMPlayground.xcodeproj -scheme LMPlayground \
          -destination "id=$SIMULATOR" -only-testing:LMPlaygroundTests
    # As release-check.sh does, without signing.
    - name: Run lint
      run: |
        scripts/check-xcframework.sh
        scripts/bump-version.sh --check
        python3 -I scripts/generate-catalog.py --check
        xcodebuild build -project LMPlayground.xcodeproj -scheme LMPlayground -configuration Release \
          -destination 'generic/platform=iOS' -derivedDataPath build-release CODE_SIGNING_ALLOWED=NO -quiet
        stringsdata="$(find build-release/Build/Intermediates.noindex -path '*LMPlayground.build/Objects-normal/arm64' -type d | head -1)"
        python3 -I scripts/generate-strings.py --stringsdata "$stringsdata" --check
    # The other UI tests need a downloaded model; the scroll tests seed their
    # own chats.
    - name: Run UI tests
      run: |
        xcodebuild test -project LMPlayground.xcodeproj -scheme LMPlayground \
          -destination "id=$SIMULATOR" -only-testing:LMPlaygroundUITests/ChatScrollUITests
