name: Deploy to Google Play Internal

on:
  push:
    branches:
      - main

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The default also installs the legacy "tools" package, which the SDK
        # repository no longer serves; sdkmanager then fails the job.
        packages: 'platform-tools'

    # The Vulkan backend (GGML_VULKAN=ON) needs three host build-time deps that
    # build.gradle probes for at configure time but the runner lacks by default:
    #   - glslc: bundled in the pinned NDK, but AGP only auto-downloads the NDK
    #     during task execution (after the path is probed), so pre-install it.
    #   - Vulkan C++ headers (vulkan.hpp) and SPIRV-Headers (CONFIG package +
    #     include dir), needed by ggml-vulkan's find_package / includes.
    # We install them and export the override env vars build.gradle reads, so
    # the exact paths reach CMake regardless of where apt places them.
    - name: Set up Vulkan toolchain for the native build
      run: |
        set -eu
        SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
        printf 'y\n' | "$SDKMANAGER" --install "ndk;27.2.12479018" >/dev/null
        GLSLC="$ANDROID_HOME/ndk/27.2.12479018/shader-tools/linux-x86_64/glslc"
        test -x "$GLSLC"
        echo "VULKAN_GLSLC=$GLSLC" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev spirv-headers
        # apt installs these under /usr/include, which CMake omits from -I for
        # the NDK cross-compiler (it treats /usr/include as a standard dir the
        # host compiler already searches; the cross clang does not). Stage them
        # under a non-standard prefix so the -I is actually emitted.
        VKINC="$RUNNER_TEMP/vk-headers/include"
        mkdir -p "$VKINC"
        for d in vulkan vk_video spirv; do
          [ -d "/usr/include/$d" ] && cp -r "/usr/include/$d" "$VKINC/"
        done
        test -f "$VKINC/vulkan/vulkan.hpp"
        test -f "$VKINC/spirv/unified1/spirv.hpp"
        SPIRV_CFG="$(find /usr -name SPIRV-HeadersConfig.cmake 2>/dev/null | head -1)"
        test -n "$SPIRV_CFG"
        echo "VULKAN_HEADERS_DIR=$VKINC" >> "$GITHUB_ENV"
        echo "SPIRV_HEADERS_INCLUDE_DIR=$VKINC" >> "$GITHUB_ENV"
        echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")" >> "$GITHUB_ENV"

    - name: Setup Ruby (for fastlane)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Decode keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/keystore.jks

    - name: Build release bundle
      run: ./gradlew bundleRelease
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        LM_PLAYGROUND_KEY_ALIAS: ${{ secrets.LM_PLAYGROUND_KEY_ALIAS }}
        LM_PLAYGROUND_KEY_PASSWORD: ${{ secrets.LM_PLAYGROUND_KEY_PASSWORD }}

    - name: Write service account JSON
      run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/play-sa.json"

    # Fastlane looks for fastlane/metadata/android/*/changelogs/{versionCode}.txt.
    # We keep one file per versionName (e.g. 10500.txt for 1.5.0) and copy it
    # to the exact versionCode filename so every deploy ships release notes.
    # If a release has no version-specific changelog, fall back to the
    # locale's default.txt ("performance and stability improvements") so
    # internal-only patches still ship localized notes.
    # Version is the single source of truth in version.properties (shared with gradle).
    - name: Stage changelog for build
      run: |
        source version.properties
        BASE=$((major * 10000 + minor * 100 + patch))
        VERSION_CODE=$((BASE * 1000 + GITHUB_RUN_NUMBER))
        SOURCE_NAME="${BASE}.txt"
        echo "version=$major.$minor.$patch, versionCode=$VERSION_CODE, source=$SOURCE_NAME"
        for dir in fastlane/metadata/android/*/changelogs; do
          if [ -f "$dir/$SOURCE_NAME" ]; then
            cp "$dir/$SOURCE_NAME" "$dir/${VERSION_CODE}.txt"
          elif [ -f "$dir/default.txt" ]; then
            cp "$dir/default.txt" "$dir/${VERSION_CODE}.txt"
          fi
        done

    - name: Upload AAB + changelog to Play Store
      env:
        GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-sa.json
      run: bundle exec fastlane deploy_internal

    - name: Cleanup secrets
      if: always()
      run: |
        rm -f ~/.android/keystore.jks
        rm -f "$RUNNER_TEMP/play-sa.json"
